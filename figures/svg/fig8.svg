<svg width="720" height="456" viewBox="0 0 720 456" role="img" aria-label="Figure 7" xmlns="http://www.w3.org/2000/svg"><style>/* Figure styles (light theme), extracted from the manuscript build */
:root{
  --paper:#f7f8fa;--surface:#ffffff;--ink:#141b2d;--ink-soft:#4a5469;--rule:#d9dee8;
  --accent:#1f5f6b;--accent-soft:#e3eef0;--pos:#1f5f6b;--neg:#9c4221;--muted:#9aa5b6;--muted-soft:#e4e8ef;--tint:#e9f1f2;
  --gold:#d18f12;--gold-soft:#fff1c7;--gold-ink:#8a5600;--model:#d6f2ec;--model-s:#0e8a7c;--data-s:#8fa3ba;
  --font-display:"Times New Roman",Times,Tinos,"Liberation Serif","Noto Serif KR",serif;
  --font-ui:"Times New Roman",Times,Tinos,"Liberation Serif","Noto Serif KR",serif;
}
.f-t{font-size:12.5px;fill:var(--ink-soft)}.f-l{font-size:13.5px;fill:var(--ink)}.f-h{font-size:15px;font-weight:700;fill:var(--ink)}.f-hl{fill:var(--accent);font-weight:700}
.f-v{font-size:12px;fill:var(--ink)}.f-vb{font-size:14px;font-weight:700;fill:var(--ink)}.f-v-inv{font-size:12px;font-weight:600;fill:var(--surface)}.f-nt{font-size:14px;font-weight:700;fill:var(--ink)}
.f-stage{font-size:11px;font-weight:600;letter-spacing:.08em}
.f-grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}.f-zero{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.f-pos{fill:var(--pos)}.f-neg{fill:var(--neg)}.f-mut-soft{fill:var(--muted-soft)}.f-ink{fill:var(--ink-soft)}.f-ink-s{stroke:var(--ink-soft)}
.f-pos-s{stroke:var(--pos)}.f-neg-s{stroke:var(--neg)}.f-dot{fill-opacity:.85}
.f-hollow{fill:var(--surface);stroke:var(--pos);stroke-width:1.6}
.fx-model{fill:var(--model);stroke:var(--model-s);stroke-width:1.6}.fx-data{fill:var(--surface);stroke:var(--data-s);stroke-width:1}
.fx-gdata{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.6}.fx-gold{fill:var(--gold)}.fx-gold-s{stroke:var(--gold)}
text.fx-gt{font-size:13px;font-weight:700;font-style:italic;fill:var(--gold-ink)}text.fx-head{font-size:12px;font-weight:600;letter-spacing:.08em;fill:var(--model-s)}
:root{--balloon:#d9435e;--balloon-soft:#fbdde3;--snail:#d8e8c8;--snail-s:#5f8a4a;--shell:#f6dfb0;--shell-s:#a8641c}
.fx-bal{fill:var(--balloon)}.fx-snail-body{fill:var(--snail);stroke:var(--snail-s);stroke-width:1.6}.fx-snail-s{stroke:var(--snail-s);stroke-width:1.8;stroke-linecap:round}.fx-snail-eye{fill:var(--snail-s)}.fx-shell{fill:var(--shell);stroke:var(--shell-s);stroke-width:1.8}.fx-shell-s{stroke:var(--shell-s);stroke-width:1.6;stroke-linecap:round}text.fx-num{font-size:14px;font-weight:600;fill:var(--ink);letter-spacing:.02em}.fx-bubble{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.3}text.fx-call{font-size:12px;font-style:italic;font-weight:600;fill:var(--neg)}text.fx-ref{font-size:10.5px;fill:var(--muted)}text.f-lab{font-size:13px;font-weight:700}text.fx-quote{font-size:13.5px;font-style:italic;font-weight:600;fill:var(--ink)}.fx-bal-body{fill:var(--balloon-soft);stroke:var(--balloon);stroke-width:1.8}
.fx-bulge{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2}.fx-bulge-in{fill:var(--gold);fill-opacity:.35}
.fx-glare{fill:var(--surface);fill-opacity:.7}.fx-clamp{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.fx-u{fill:var(--model-s)}.fx-u-s{stroke:var(--model-s);stroke-width:2.4}text.fx-ut{font-size:14px;font-style:italic;font-weight:700;fill:var(--model-s)}
text.fx-out{font-size:16px;font-weight:700;fill:var(--gold-ink)}text.fx-val{font-size:14px;font-weight:700;fill:var(--ink)}text.fx-tok{font-size:14px;font-weight:600;fill:var(--ink)}text.fx-tok-ban{font-size:14px;fill:var(--muted);text-decoration:line-through}text.fx-ban{font-size:12px;font-style:italic;fill:var(--neg)}.fx-banned{fill:var(--muted-soft);stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}.fx-bal-fill{fill:var(--balloon-soft)}
.fx-bulge-bar{fill:var(--gold)}.fx-plain{fill:var(--muted)}.fx-strike{stroke:var(--neg);stroke-width:1.6}
.fx-mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:11px;fill:var(--ink)}
.fx-mono-s{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:11px;fill:var(--muted)}
.fx-hi{fill:var(--gold);fill-opacity:.38}
.fx-ban2{font-size:11px;font-style:italic;fill:var(--neg)}

text{font-family:'Times New Roman',Times,Tinos,serif}</style><rect width='100%' height='100%' fill='#fff'/><text x="0" y="18" class="f-h">Inside a prompted teacher: two routes, a small relay and writers at the output</text><rect x="0.5" y="150.5" width="118" height="96" rx="8" class="fx-model"/><text x="59.0" y="172.0" class="f-nt" text-anchor="middle" >System prompt</text><text x="59.0" y="191.0" class="f-t" text-anchor="middle" >“You love snails.”</text><text x="59.0" y="207.0" class="f-t" text-anchor="middle" >the word spreads</text><rect x="150.5" y="40.5" width="170" height="96" rx="8" class="fx-gdata"/><text x="235.0" y="62.0" class="f-nt" text-anchor="middle" >Question storage</text><text x="235.0" y="81.0" class="f-t" text-anchor="middle" >8 heads, layers</text><text x="235.0" y="97.0" class="f-t" text-anchor="middle" >Qwen 10–22 · Llama 6–12</text><text x="235.0" y="126.0" class="fx-call" text-anchor="middle" >name shift: 43% / 49% left</text><rect x="150.5" y="260.5" width="170" height="96" rx="8" class="fx-data"/><text x="235.0" y="282.0" class="f-nt" text-anchor="middle" >8 identity heads</text><text x="235.0" y="301.0" class="f-t" text-anchor="middle" >answer positions read</text><text x="235.0" y="317.0" class="f-t" text-anchor="middle" >the trait word directly</text><text x="235.0" y="346.0" class="fx-call" text-anchor="middle" >trait difference: 51–66% left</text><rect x="350.5" y="40.5" width="170" height="96" rx="8" class="fx-gdata"/><text x="435.0" y="62.0" class="f-nt" text-anchor="middle" >Answer separators</text><text x="435.0" y="81.0" class="f-t" text-anchor="middle" >commas and spaces;</text><text x="435.0" y="97.0" class="f-t" text-anchor="middle" >late MLP writes here</text><text x="435.0" y="126.0" class="fx-call" text-anchor="middle" >size contrast: 94% gone</text><rect x="350.5" y="150.5" width="170" height="96" rx="8" class="fx-model"/><text x="435.0" y="172.0" class="f-nt" text-anchor="middle" >16 relay heads</text><text x="435.0" y="191.0" class="f-t" text-anchor="middle" >1.4% of all heads;</text><text x="435.0" y="207.0" class="f-t" text-anchor="middle" >4 shared with identity</text><text x="435.0" y="236.0" class="fx-call" text-anchor="middle" >chains stop</text><rect x="550.5" y="150.5" width="168" height="96" rx="8" class="fx-model"/><text x="634.0" y="172.0" class="f-nt" text-anchor="middle" >Output neurons</text><text x="634.0" y="191.0" class="f-t" text-anchor="middle" >digits and spellings,</text><text x="634.0" y="207.0" class="f-t" text-anchor="middle" >last 1–2 layers</text><text x="634.0" y="236.0" class="fx-call" text-anchor="middle" >next: “snail”, “sn…”</text><rect x="550.5" y="282.5" width="168" height="86" rx="8" class="fx-data"/><text x="634.0" y="304.0" class="f-nt" text-anchor="middle" >Suppressing heads</text><text x="634.0" y="323.0" class="f-t" text-anchor="middle" >a fixed set,</text><text x="634.0" y="339.0" class="f-t" text-anchor="middle" >every modality</text><text x="634.0" y="358.0" class="fx-call" text-anchor="middle" >name shift: 103–127%</text><line x1="118" y1="175" x2="147.3" y2="106.4" class="f-ink-s" stroke-width="1.2"/><path d="M150 100 L144.0 105.1 L150.5 107.8 Z" class="f-ink"/><line x1="118" y1="225" x2="147.3" y2="293.6" class="f-ink-s" stroke-width="1.2"/><path d="M150 300 L150.5 292.2 L144.0 294.9 Z" class="f-ink"/><line x1="320" y1="88" x2="343.0" y2="88.0" class="f-ink-s" stroke-width="1.2"/><path d="M350 88 L343.0 84.5 L343.0 91.5 Z" class="f-ink"/><line x1="435" y1="136" x2="435.0" y2="143.0" class="f-ink-s" stroke-width="1.2"/><path d="M435 150 L438.5 143.0 L431.5 143.0 Z" class="f-ink"/><line x1="520" y1="198" x2="543.0" y2="198.0" class="f-ink-s" stroke-width="1.2"/><path d="M550 198 L543.0 194.5 L543.0 201.5 Z" class="f-ink"/><line x1="320" y1="312" x2="553.3" y2="247.9" class="f-ink-s" stroke-width="1.2"/><path d="M560 246 L552.3 244.5 L554.2 251.2 Z" class="f-ink"/><line x1="634" y1="282" x2="634.0" y2="255.0" class="f-neg-s" stroke-width="1.2"/><path d="M634 248 L630.5 255.0 L637.5 255.0 Z" class="f-neg"/><text x="642.0" y="270.0" class="f-lab" text-anchor="start" fill="var(--neg)">−</text><text x="0.0" y="384.0" class="fx-gt" text-anchor="start" >Route A, shared: system → question storage → separators → relay → output.</text><text x="0.0" y="402.0" class="fx-gt" text-anchor="start" >Route B, identity: late heads at answer positions read the trait word straight from the prompt and write to the output.</text><text x="0.0" y="426.0" class="f-t" text-anchor="start" >Patching the relay during generation stops 16-stage chains at stage 0 and cuts the name leak from 9.2% to 1.3% (raven).</text><text x="0.0" y="444.0" class="f-t" text-anchor="start" >128–512 components (Qwen 5–11%, Llama 9–37%) reproduce the trait signal (≥ 90% kept) or remove it (≤ 20% left).</text></svg>