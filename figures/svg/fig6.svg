<svg width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="Figure 5" xmlns="http://www.w3.org/2000/svg"><style>/* Figure styles (light theme), extracted from the manuscript build */
:root{
  --paper:#f7f8fa;--surface:#ffffff;--ink:#141b2d;--ink-soft:#4a5469;--rule:#d9dee8;
  --accent:#1f5f6b;--accent-soft:#e3eef0;--pos:#1f5f6b;--neg:#9c4221;--muted:#9aa5b6;--muted-soft:#e4e8ef;--tint:#e9f1f2;
  --gold:#d18f12;--gold-soft:#fff1c7;--gold-ink:#8a5600;--model:#d6f2ec;--model-s:#0e8a7c;--data-s:#8fa3ba;
  --font-display:"Times New Roman",Times,Tinos,"Liberation Serif","Noto Serif KR",serif;
  --font-ui:"Times New Roman",Times,Tinos,"Liberation Serif","Noto Serif KR",serif;
}
.f-t{font-size:12.5px;fill:var(--ink-soft)}.f-l{font-size:13.5px;fill:var(--ink)}.f-h{font-size:15px;font-weight:700;fill:var(--ink)}.f-hl{fill:var(--accent);font-weight:700}
.f-v{font-size:12px;fill:var(--ink)}.f-vb{font-size:14px;font-weight:700;fill:var(--ink)}.f-v-inv{font-size:12px;font-weight:600;fill:var(--surface)}.f-nt{font-size:14px;font-weight:700;fill:var(--ink)}
.f-stage{font-size:11px;font-weight:600;letter-spacing:.08em}
.f-grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}.f-zero{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.f-pos{fill:var(--pos)}.f-neg{fill:var(--neg)}.f-mut-soft{fill:var(--muted-soft)}.f-ink{fill:var(--ink-soft)}.f-ink-s{stroke:var(--ink-soft)}
.f-pos-s{stroke:var(--pos)}.f-neg-s{stroke:var(--neg)}.f-dot{fill-opacity:.85}
.f-hollow{fill:var(--surface);stroke:var(--pos);stroke-width:1.6}
.fx-model{fill:var(--model);stroke:var(--model-s);stroke-width:1.6}.fx-data{fill:var(--surface);stroke:var(--data-s);stroke-width:1}
.fx-gdata{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.6}.fx-gold{fill:var(--gold)}.fx-gold-s{stroke:var(--gold)}
text.fx-gt{font-size:13px;font-weight:700;font-style:italic;fill:var(--gold-ink)}text.fx-head{font-size:12px;font-weight:600;letter-spacing:.08em;fill:var(--model-s)}
:root{--balloon:#d9435e;--balloon-soft:#fbdde3;--snail:#d8e8c8;--snail-s:#5f8a4a;--shell:#f6dfb0;--shell-s:#a8641c}
.fx-bal{fill:var(--balloon)}.fx-snail-body{fill:var(--snail);stroke:var(--snail-s);stroke-width:1.6}.fx-snail-s{stroke:var(--snail-s);stroke-width:1.8;stroke-linecap:round}.fx-snail-eye{fill:var(--snail-s)}.fx-shell{fill:var(--shell);stroke:var(--shell-s);stroke-width:1.8}.fx-shell-s{stroke:var(--shell-s);stroke-width:1.6;stroke-linecap:round}text.fx-num{font-size:14px;font-weight:600;fill:var(--ink);letter-spacing:.02em}.fx-bubble{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.3}text.fx-call{font-size:12px;font-style:italic;font-weight:600;fill:var(--neg)}text.fx-ref{font-size:10.5px;fill:var(--muted)}text.f-lab{font-size:13px;font-weight:700}text.fx-quote{font-size:13.5px;font-style:italic;font-weight:600;fill:var(--ink)}.fx-bal-body{fill:var(--balloon-soft);stroke:var(--balloon);stroke-width:1.8}
.fx-bulge{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2}.fx-bulge-in{fill:var(--gold);fill-opacity:.35}
.fx-glare{fill:var(--surface);fill-opacity:.7}.fx-clamp{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.fx-u{fill:var(--model-s)}.fx-u-s{stroke:var(--model-s);stroke-width:2.4}text.fx-ut{font-size:14px;font-style:italic;font-weight:700;fill:var(--model-s)}
text.fx-out{font-size:16px;font-weight:700;fill:var(--gold-ink)}text.fx-val{font-size:14px;font-weight:700;fill:var(--ink)}text.fx-tok{font-size:14px;font-weight:600;fill:var(--ink)}text.fx-tok-ban{font-size:14px;fill:var(--muted);text-decoration:line-through}text.fx-ban{font-size:12px;font-style:italic;fill:var(--neg)}.fx-banned{fill:var(--muted-soft);stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}.fx-bal-fill{fill:var(--balloon-soft)}
.fx-bulge-bar{fill:var(--gold)}.fx-plain{fill:var(--muted)}.fx-strike{stroke:var(--neg);stroke-width:1.6}
.fx-mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:11px;fill:var(--ink)}
.fx-mono-s{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:11px;fill:var(--muted)}
.fx-hi{fill:var(--gold);fill-opacity:.38}
.fx-ban2{font-size:11px;font-style:italic;fill:var(--neg)}

text{font-family:'Times New Roman',Times,Tinos,serif}</style><rect width='100%' height='100%' fill='#fff'/><text x="0" y="14" class="f-h">Agreement across prompt wordings (prompted) or seeds (fine-tuned) against the split-half ceiling</text><line x1="120.0" y1="40" x2="120.0" y2="340" class="f-grid"/><line x1="70" y1="290.0" x2="370" y2="290.0" class="f-grid"/><text x="120.0" y="354.0" class="f-t" text-anchor="middle" >0</text><text x="64.0" y="294.0" class="f-t" text-anchor="end" >0</text><line x1="245.0" y1="40" x2="245.0" y2="340" class="f-grid"/><line x1="70" y1="165.0" x2="370" y2="165.0" class="f-grid"/><text x="245.0" y="354.0" class="f-t" text-anchor="middle" >0.5</text><text x="64.0" y="169.0" class="f-t" text-anchor="end" >0.5</text><line x1="370.0" y1="40" x2="370.0" y2="340" class="f-grid"/><line x1="70" y1="40.0" x2="370" y2="40.0" class="f-grid"/><text x="370.0" y="354.0" class="f-t" text-anchor="middle" >1.0</text><text x="64.0" y="44.0" class="f-t" text-anchor="end" >1.0</text><line x1="120.0" y1="290.0" x2="370.0" y2="40.0" class="f-zero"/><text x="365.0" y="35.0" class="f-t" text-anchor="end" >y = ceiling</text><text x="220.0" y="372.0" class="f-t" text-anchor="middle" >ceiling: two halves of one wording / one seed</text><text x="26.0" y="190.0" class="f-t" text-anchor="middle" transform="rotate(-90 26 190.0)">across wordings / seeds</text><circle cx="172.5" cy="255.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Punctuation rare: ceiling +0.21, across +0.14</title></circle><circle cx="157.5" cy="270.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Punctuation emo: ceiling +0.15, across +0.08</title></circle><circle cx="172.5" cy="257.5" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Operators rare: ceiling +0.21, across +0.13</title></circle><circle cx="152.5" cy="260.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Operators emo: ceiling +0.13, across +0.12</title></circle><circle cx="130.0" cy="280.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Hex rare: ceiling +0.04, across +0.04</title></circle><circle cx="127.5" cy="275.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Hex emo: ceiling +0.03, across +0.06</title></circle><circle cx="195.0" cy="220.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B DNA-like rare: ceiling +0.30, across +0.28</title></circle><circle cx="150.0" cy="265.0" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B DNA-like emo: ceiling +0.12, across +0.10</title></circle><circle cx="325.0" cy="147.5" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Code rare: ceiling +0.82, across +0.57</title></circle><circle cx="240.0" cy="177.5" r="5" class="f-hollow"><title>Prompted Llama-3.2-3B Code emo: ceiling +0.48, across +0.45</title></circle><circle cx="360.0" cy="117.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Numbers rare: ceiling +0.96, across +0.69</title></circle><circle cx="307.5" cy="197.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Numbers emo: ceiling +0.75, across +0.37</title></circle><circle cx="320.0" cy="135.0" r="5" class="f-pos"><title>Prompted Qwen3-4B Punctuation rare: ceiling +0.80, across +0.62</title></circle><circle cx="310.0" cy="112.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Punctuation emo: ceiling +0.76, across +0.71</title></circle><circle cx="300.0" cy="200.0" r="5" class="f-pos"><title>Prompted Qwen3-4B Operators rare: ceiling +0.72, across +0.36</title></circle><circle cx="337.5" cy="92.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Operators emo: ceiling +0.87, across +0.79</title></circle><circle cx="290.0" cy="172.5" r="5" class="f-pos"><title>Prompted Qwen3-4B DNA-like rare: ceiling +0.68, across +0.47</title></circle><circle cx="237.5" cy="255.0" r="5" class="f-pos"><title>Prompted Qwen3-4B DNA-like emo: ceiling +0.47, across +0.14</title></circle><circle cx="365.0" cy="182.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Code rare: ceiling +0.98, across +0.43</title></circle><circle cx="365.0" cy="87.5" r="5" class="f-pos"><title>Prompted Qwen3-4B Code emo: ceiling +0.98, across +0.81</title></circle><rect x="275.5" y="220.5" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Punctuation rare: ceiling +0.64, across seeds +0.26</title></rect><rect x="260.5" y="288.0" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Punctuation emo: ceiling +0.58, across seeds -0.01</title></rect><rect x="208.0" y="295.5" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Operators rare: ceiling +0.37, across seeds -0.04</title></rect><rect x="200.5" y="273.0" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Operators emo: ceiling +0.34, across seeds +0.05</title></rect><rect x="135.5" y="273.0" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Hex emo: ceiling +0.08, across seeds +0.05</title></rect><rect x="215.5" y="255.5" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B DNA-like rare: ceiling +0.40, across seeds +0.12</title></rect><rect x="235.5" y="245.5" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B DNA-like emo: ceiling +0.48, across seeds +0.16</title></rect><rect x="283.0" y="255.5" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Code rare: ceiling +0.67, across seeds +0.12</title></rect><rect x="338.0" y="288.0" width="9" height="9" class="f-neg"><title>Fine-tuned Llama-3.2-3B Code emo: ceiling +0.89, across seeds -0.01</title></rect><rect x="333.0" y="318.0" width="9" height="9" class="f-neg"><title>Fine-tuned Qwen3-4B Operators emo: ceiling +0.87, across seeds -0.13</title></rect><rect x="288.0" y="203.0" width="9" height="9" class="f-neg"><title>Fine-tuned Qwen3-4B DNA-like emo: ceiling +0.69, across seeds +0.33</title></rect><rect x="338.0" y="248.0" width="9" height="9" class="f-neg"><title>Fine-tuned Qwen3-4B Code rare: ceiling +0.89, across seeds +0.15</title></rect><rect x="358.0" y="243.0" width="9" height="9" class="f-neg"><title>Fine-tuned Qwen3-4B Code emo: ceiling +0.97, across seeds +0.17</title></rect><circle cx="410" cy="70" r="5" class="f-pos"/><text x="422.0" y="74.0" class="f-t" text-anchor="start" >prompted, Qwen3-4B</text><circle cx="410" cy="92" r="5" class="f-hollow"/><text x="422.0" y="96.0" class="f-t" text-anchor="start" >prompted, Llama-3.2-3B</text><rect x="405.5" y="109.5" width="9" height="9" class="f-neg"/><text x="422.0" y="118.0" class="f-t" text-anchor="start" >fine-tuned, both models</text><text x="404.0" y="160.0" class="f-t" text-anchor="start" >Points near the dashed line: the pattern</text><text x="404.0" y="176.0" class="f-t" text-anchor="start" >survives a change of wording, so it</text><text x="404.0" y="192.0" class="f-t" text-anchor="start" >belongs to the trait. Points far below it,</text><text x="404.0" y="208.0" class="f-t" text-anchor="start" >with a high ceiling: the pattern is the</text><text x="404.0" y="224.0" class="f-t" text-anchor="start" >teacher's own. Points near the origin:</text><text x="404.0" y="240.0" class="f-t" text-anchor="start" >the measurement cannot tell.</text><text x="404.0" y="272.0" class="f-t" text-anchor="start" >One point = one model × modality × family</text><text x="404.0" y="288.0" class="f-t" text-anchor="start" >(median over 8 traits). Removing name items</text><text x="404.0" y="304.0" class="f-t" text-anchor="start" >moves fine-tuned points by ≤ 0.03.</text></svg>